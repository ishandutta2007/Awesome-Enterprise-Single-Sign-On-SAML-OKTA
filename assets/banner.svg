<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
      }
      @keyframes floatBeam {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .glow-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 200px 150px;
      }
      .glow-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite alternate;
        transform-origin: 1000px 250px;
      }
      .flow-path {
        stroke-dasharray: 12, 12;
        animation: floatBeam 15s linear infinite;
      }
      .floating-pill {
        animation: orbitCard 4s ease-in-out infinite;
      }
      .pill-delay-1 { animation-delay: -1.3s; }
      .pill-delay-2 { animation-delay: -2.6s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Behind everything) -->
  <circle class="glow-orb-1" cx="220" cy="160" r="170" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
  <circle class="glow-orb-2" cx="980" cy="240" r="190" fill="url(#glowGrad2)" filter="url(#blurFilter)" />

  <!-- Geometric Grid Layer -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Dynamic Cyber/Network Circuit Lines -->
  <g opacity="0.4">
    <path class="flow-path" d="M 80,80 L 300,80 L 450,160 L 750,160 L 900,80 L 1120,80" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-path" d="M 80,320 L 260,320 L 400,240 L 800,240 L 940,320 L 1120,320" fill="none" stroke="#06b6d4" stroke-width="2" />
    <circle cx="450" cy="160" r="4" fill="#818cf8" />
    <circle cx="750" cy="160" r="4" fill="#818cf8" />
    <circle cx="400" cy="240" r="4" fill="#22d3ee" />
    <circle cx="800" cy="240" r="4" fill="#22d3ee" />
  </g>

  <!-- Dynamic Floating Ecosystem Badges (Pills) - Placed gracefully around center -->
  <g class="floating-pill pill-delay-1" transform="translate(100, 290)">
    <rect width="130" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#3b82f6" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SAML 2.0</text>
  </g>

  <g class="floating-pill" transform="translate(250, 290)">
    <rect width="140" height="36" rx="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#8b5cf6" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">OIDC / OAuth</text>
  </g>

  <g class="floating-pill pill-delay-2" transform="translate(810, 290)">
    <rect width="130" height="36" rx="18" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#06b6d4" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SCIM 2.0</text>
  </g>

  <g class="floating-pill pill-delay-1" transform="translate(960, 290)">
    <rect width="140" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Zero Trust</text>
  </g>

  <!-- FOREGROUND TEXT ELEMENTS (Guaranteed crisp and unobstructed) -->
  <g text-anchor="middle">
    <!-- Top Super-header Tag -->
    <rect x="470" y="55" width="260" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" opacity="0.85" />
    <text x="600" y="74" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE IAM &amp; FEDERATION</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Enterprise Single Sign-On</text>
    
    <!-- Subtitle -->
    <text x="600" y="190" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600">SAML 2.0 • Okta • OIDC • Open-Source Identity Providers</text>

    <!-- Tagline description -->
    <text x="600" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">Curated landscape of commercial SaaS platforms &amp; battle-tested self-hosted IAM engines</text>
  </g>
</svg>